services:
  db:
    image: postgres:15-alpine
    container_name: proyecto_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secreta
      POSTGRES_DB: mi_app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mi_app"]
      interval: 5s
      retries: 5

  api:
    build: ./api
    container_name: proyecto_api
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASS: secreta
      DB_NAME: mi_app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    build: ./web
    container_name: proyecto_web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - frontend
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend:
